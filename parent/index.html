<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183b3b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="小书包家长端"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"><title>小书包 · 家长控制端</title><link rel="stylesheet" href="style.css?v=050"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"></head><body>
<header><div class="brand">小书包<span>家长控制端</span></div><span class="private">私有家庭空间</span></header>
<main><section class="intro"><p class="eyebrow">把规则交给设备，把陪伴留给家人。</p><h1>孩子的使用节奏，<br>在这里掌握。</h1><p>远程调整答题规则，查看设备状态和操作记录。</p></section>
<div id="notice" role="status" aria-live="polite"></div>
<section id="login" class="card"><h2>连接家庭仓库</h2><p class="muted">使用独立的 GitHub 私有仓库。可在自己的设备上记住钥匙，下次打开自动连接。</p><label>私有仓库<input id="repo" placeholder="用户名/study-gate-family" autocomplete="off"></label><label>远程管理钥匙<input id="key" type="password" autocomplete="off" placeholder="GitHub fine-grained token"></label><label><input id="remember" type="checkbox" checked> 在本机记住钥匙，下次自动连接</label><p class="hint">仅在自己的手机或电脑上勾选。钥匙加密保存在当前浏览器；共用此浏览器的人也能打开控制端。</p><label>从钥匙说明文件导入<input id="importKey" type="file" accept=".txt,text/plain"></label><button id="connect" class="primary">连接控制端</button><p class="hint">钥匙只需该私有仓库 Contents 读写权限。孩子端也需在家长设置中配对同一个仓库。不要填写到公开题库文件中。</p></section>
<section id="dashboard" hidden><div class="toolbar"><h2>孩子设备</h2><div><button id="refresh">刷新状态</button><button id="logout">退出并忘记钥匙</button></div></div><div id="devices" class="devices"></div><div id="detail"></div></section>
<footer>远程开关需要孩子设备联网。未连接时保留原规则，页面会显示最后上报时间。</footer></main><script src="family.js?v=050"></script><script src="credentials.js"></script><script src="panel.js?v=050"></script></body></html>
